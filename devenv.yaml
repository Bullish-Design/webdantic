# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # devenv's own `integrations/git-hooks.nix` throws unless one of `git-hooks`
  # or `pre-commit-hooks` is declared, and it is reached while evaluating
  # `config.shell` — so without this the shell does not enter AT ALL:
  #
  #   error: git-hooks or pre-commit-hooks input required
  #
  # `pydantree` carries the same template and the same direct shellij import,
  # and works because it declares this. Adding it is what makes this repository
  # adoptable (STAGE_7_LOG.md, wave 2b).
  pre-commit-hooks:
    url: github:cachix/pre-commit-hooks.nix

imports: []

# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
